<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#EA580B" />
  <meta name="description" content="SEO on autopilot with daily articles" />
  <title>Blawgy</title>
  <link href="/static/css/main.371b1f5a.css" rel="stylesheet" />
  <style>
    @media (max-width: 640px) {
      .fixed.z-\[10001\].w-\[380px\] {
        left: 50% !important;
        right: auto !important;
        width: calc(100vw - 32px) !important;
        max-width: 380px !important;
        transform: translateX(-50%) !important;
      }
    }
  </style>
  <script>
    (function () {
      // SirBloggsAlot boot shim for the vendored Blawgy SPA bundle.
      //
      // Authentication is the REAL server session: the HttpOnly `sirbloggs_session`
      // cookie issued by POST /api/auth/google and verified server-side. This shim's
      // only job is to adapt that session into the small set of Firebase-shaped
      // globals the compiled bundle reads (__BLAWGY_LOCAL_USER__ / __BLAWGY_LOCAL_SITE__
      // / __BLAWGY_LOCAL_AUTH__ / __BLAWGY_API_BASE__).
      //
      // It never fabricates an identity and never forges a bearer token. An
      // unauthenticated visitor is redirected to /login. The browser attaches the
      // cookie automatically on same-origin requests, so no Authorization header is
      // synthesized here and no fetch/XHR patching is done.
      var defaultSite = "__SBA_PRIMARY_SITE__";
      window.__BLAWGY_API_BASE__ = window.location.origin;

      // Facebook Pixel no-op stub so bundle analytics calls don't throw.
      window.fbq = window.fbq || function () {};
      window.fbq.loaded = true;
      window.fbq.version = "2.0";
      window.fbq.queue = [];
      window._fbq = window.fbq;

      function installSession(sessionUser) {
        var email = String(sessionUser.email || "").toLowerCase();
        var name = sessionUser.name || email;
        var picture = sessionUser.picture || "";
        // Role/admin status comes from the SERVER session only.
        var role = sessionUser.role === "admin" ? "admin" : "client";
        var subject = sessionUser.id || sessionUser.sub || email;
        var sites = Array.isArray(sessionUser.sites) ? sessionUser.sites : [];

        window.__BLAWGY_LOCAL_USER__ = {
          id: subject,
          uid: subject,
          email: email,
          name: name,
          displayName: name,
          picture: picture,
          photoURL: picture,
          role: role,
          isAdmin: role === "admin",
          sites: sites,
          blogType: "wordpress",
          // Client-side seed only; the server (/me, /get-site-settings, /api/plan)
          // is the source of truth and overwrites this on load. Billing is stubbed
          // in this phase.
          subscription: { isActive: true, plan: "growth", credits: 1000, maxCredits: 1000 },
          getIdToken: function () { return Promise.resolve(""); },
          getIdTokenResult: function () { return Promise.resolve({ token: "" }); }
        };

        window.__BLAWGY_LOCAL_SITE__ = {
          site: defaultSite,
          email: email,
          settings: { site: defaultSite, blogType: "wordpress", gsc: {} },
          success: true,
          onboard: true
        };

        window.__BLAWGY_LOCAL_AUTH__ = {
          currentUser: window.__BLAWGY_LOCAL_USER__,
          onAuthStateChanged: function (callback) {
            setTimeout(function () { callback(window.__BLAWGY_LOCAL_USER__); }, 0);
            return function () {};
          },
          signOut: function () {
            window.__blawgyIntentionalSignOut = true;
            return fetch("/api/auth/logout", {
              method: "POST",
              headers: { "content-type": "application/json" },
              credentials: "same-origin"
            }).finally(function () {
              window.__BLAWGY_LOCAL_AUTH__.currentUser = null;
              window.location.replace("/login");
            });
          }
        };
      }

      function loadBlawgyBundle() {
        var script = document.createElement("script");
        script.src = "/static/js/main.715d1cb0.local.js";
        script.defer = true;
        document.head.appendChild(script);
      }

      function redirectToLogin() {
        var next = encodeURIComponent(window.location.pathname + window.location.search);
        window.location.replace("/login?next=" + next);
      }

      fetch("/api/auth/session", {
        headers: { accept: "application/json" },
        credentials: "same-origin"
      })
        .then(function (response) { return response.ok ? response.json() : null; })
        .then(function (session) {
          if (session && session.authenticated && session.user) {
            installSession(session.user);
            loadBlawgyBundle();
          } else {
            redirectToLogin();
          }
        })
        .catch(function () { redirectToLogin(); });
    })();
  </script>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>
</html>
