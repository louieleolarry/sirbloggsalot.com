server {
    server_name sirbloggsalot.com www.sirbloggsalot.com;

    root /var/www/sirbloggsalot.com/html;
    index index.html;

    access_log /var/log/nginx/sirbloggsalot.com.access.log;
    error_log /var/log/nginx/sirbloggsalot.com.error.log;

    location = /index {
        return 301 /;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5187;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /account {
        proxy_pass http://127.0.0.1:5187;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sirbloggsalot.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sirbloggsalot.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.sirbloggsalot.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = sirbloggsalot.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name sirbloggsalot.com www.sirbloggsalot.com;
    return 404; # managed by Certbot




}
